name: Quick reference path ordering validation
on: push
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.19'
          python-version: ${{ matrix.python }}
      - run: uv tool install tox --with tox-uv
      - run: tox r -e py${{ matrix.python == '3.10' && '310' || '313' }}
